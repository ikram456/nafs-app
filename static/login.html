<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2D6A4F, #52B788);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            font-size: 48px;
            color: #2D6A4F;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            background: #f5f5f5;
            border: none;
            transition: all 0.3s;
        }
        .tab.active {
            background: #2D6A4F;
            color: white;
        }
        .form { display: none; }
        .form.active { display: block; }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input, .field select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        .field input:focus, .field select:focus {
            border-color: #2D6A4F;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #2D6A4F;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background: #1B4332; }
        .role-select {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }
        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: all 0.3s;
        }
        .role-btn.active {
            border-color: #2D6A4F;
            background: #f0faf5;
            color: #2D6A4F;
            font-weight: bold;
        }
        .message {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #2D6A4F;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">نفس</div>
    <div class="subtitle">Votre santé mentale nous tient à cœur</div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('connexion')">Connexion</button>
        <button class="tab" onclick="showTab('inscription')">Inscription</button>
    </div>

    <!-- Formulaire Connexion -->
    <div class="form active" id="connexion">
        <div class="field">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="votre@email.com">
        </div>
        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="connecter()">Se connecter</button>
        <div class="message" id="login-message"></div>
    </div>

    <!-- Formulaire Inscription -->
    <div class="form" id="inscription">
        <div class="role-select">
            <div class="role-btn active" id="role-patient" onclick="setRole('patient')">
                Patient
            </div>
            <div class="role-btn" id="role-therapeute" onclick="setRole('therapeute')">
                Thérapeute
            </div>
        </div>
        <div class="field">
            <label>Nom</label>
            <input type="text" id="reg-nom" placeholder="Votre nom">
        </div>
        <div class="field">
            <label>Prénom</label>
            <input type="text" id="reg-prenom" placeholder="Votre prénom">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="votre@email.com">
        </div>
        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>
        <button class="btn"
