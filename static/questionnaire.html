<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Questionnaire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .navbar { background: #2D6A4F; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 28px; font-weight: bold; }
        .container { max-width: 650px; margin: 50px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1B4332; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .step-bar { display: flex; gap: 8px; margin-bottom: 35px; }
        .step { flex: 1; height: 4px; background: #e0e0e0; border-radius: 2px; transition: background 0.3s; }
        .step.active { background: #2D6A4F; }
        .question { display: none; }
        .question.visible { display: block; }
        .question h3 { color: #333; font-size: 16px; margin-bottom: 18px; font-weight: 600; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option { padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; text-align: center; font-size: 14px; color: #555; transition: all 0.2s; }
        .option:hover { border-color: #52B788; color: #2D6A4F; }
        .option.selected { border-color: #2D6A4F; background: #f0faf5; color: #2D6A4F; font-weight: 600; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 12px 28px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #2D6A4F; color: white; }
        .btn-primary:hover { background: #1B4332; }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-secondary:hover { background: #e0e0e0; }
        .loading { text-align: center; padding: 40px; display: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e0e0e0; border-top-color: #2D6A4F; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { text-align: center; display: none; }
        .result .avatar { width: 80px; height: 80px; border-radius: 50%; background: #52B788; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; font-weight: bold; margin: 0 auto 16px; }
        .result h3 { color: #1B4332; font-size: 20px; margin-bottom: 8px; }
        .result p { color: #666; font-size: 14px; margin-bottom: 24px; }
