<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Profil Thérapeute</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .navbar { background: #2D6A4F; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 28px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; margin-left: 20px; cursor: pointer; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .profil-header { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #52B788; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; font-weight: bold; flex-shrink: 0; }
        .profil-info h2 { color: #1B4332; font-size: 22px; margin-bottom: 4px; }
        .profil-info p { color: #888; font-size: 14px; }
        .note { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .etoiles { color: #f4a261; font-size: 16px; }
        .note-val { font-size: 14px; color: #555; }
        .badge-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .badge { background: #f0faf5; border: 1px solid #52B788; border-radius: 20px; padding: 5px 14px; font-size: 13px; color: #2D6A4F; }
        .badge.tarif { background: #fff3e0; border-color: #f4a261; color: #e76f51; font-weight: 600; }
        .section-title { font-size: 15px; font-weight: 600; color: #1B4332; margin-bottom: 12px; }
        .bio { color: #555; font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        .info-item { background: #f8f9fa; border-radius: 10px; padding: 14px; }
        .info-label { font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 4px; }
        .info-val { font-size: 14px; color: #333; font-weight: 600; }
        .dispo-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .dispo-tag { background: #e8f5e9; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: #2D6A4F; }
        .btn-choisir { border: none; border-radius: 12px; padding: 16px 32px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; color: white; }
        .btn-vert { background: #2D6A4F; }
        .btn-vert:hover { background: #1B4332; }
        .btn-orange { background: #f4a261; cursor: not-allowed; }
        .btn-rouge { background: #e74c3c; cursor: not-allowed; }
        .btn-bleu { background: #3498db; }
        .btn-bleu:hover { background: #2980b9; }
        .btn-choisir:disabled { opacity: 0.8; cursor: not-allowed; }
        .alert { border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; }
        .alert-warning { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
        .alert-info { background: #cce5ff; border: 1px solid #b8daff; color: #004085; }
        .loading { text-align: center; padding: 60px; color: #888; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">نفس</div>
    <div>
        <a onclick="window.location.href='/therapeutes'">← Retour à la liste</a>
    </div>
</nav>

<div class="container" id="container">
    <div class="loading">Chargement...</div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const params = new URLSearchParams(window.location.search);
    const therapeuteId = params.get('id');
    if (!therapeuteId) window.location.href = '/therapeutes';

    const couleurs = ['#52B788', '#4A90D9', '#E76F51', '#9B5DE5', '#F15BB5'];

    function etoiles(note) {
        return '★'.repeat(note || 0) + '☆'.repeat(5 - (note || 0));
    }

    async function chargerProfil() {
        try {
            const res = await fetch('/api/therapeute/' + therapeuteId);
            if (!res.ok) throw new Error('Non trouvé');
            const t = await res.json();

            const couleur = couleurs[t.id % couleurs.length];
            const initiale = (t.prenom || 'T')[0].toUpperCase();
            const specialites = t.specialites ? t.specialites.split(',') : [];
            const langues = t.langues ? t.langues.split(',') : [];
            const dispos = t.disponibilites ? t.disponibilites.split(',') : [];

            let btnHTML = '';
            if (!user) {
                btnHTML = `
                    <div class="alert alert-warning">⚠️ Connectez-vous pour envoyer une demande</div>
                    <button class="btn-choisir btn-vert" onclick="window.location.href='/login'">🔐 Se connecter</button>
                `;
            } else if (user.role !== 'patient') {
                btnHTML = `<div class="alert alert-info">ℹ️ Seuls les patients peuvent envoyer une demande</div>`;
            } else {
                btnHTML = `<button class="btn-choisir btn-vert" id="btn-choisir" onclick="envoyerDemande()">📩 Envoyer une demande</button>`;
            }

            document.getElementById('container').innerHTML = `
                <div class="card">
                    <div class="profil-header">
                        <div class="avatar" style="background:${couleur}">${initiale}</div>
                        <div class="profil-info">
                            <h2>Dr. ${t.prenom} ${t.nom}</h2>
                            <p>${t.diplome || 'Thérapeute certifié'}</p>
                            <div class="note">
                                <span class="etoiles">${etoiles(t.note_moyenne)}</span>
                                <span class="note-val">${t.note_moyenne || 0}/5 (${t.nombre_avis || 0} avis)</span>
                            </div>
                        </div>
                    </div>

                    <div class="badge-grid">
                        ${specialites.map(s => `<span class="badge">🧠 ${s.trim()}</span>`).join('')}
                        ${langues.map(l => `<span class="badge">🌍 ${l.trim()}</span>`).join('')}
                        ${t.tarif ? `<span class="badge tarif">💰 ${t.tarif} MAD / séance</span>` : ''}
                        ${t.experience_ans ? `<span class="badge">⭐ ${t.experience_ans} ans</span>` : ''}
                    </div>

                    ${t.bio ? `<div class="section-title">À propos</div><div class="bio">${t.bio}</div>` : ''}

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Genre</div>
                            <div class="info-val">${t.genre || 'Non précisé'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Tarif</div>
                            <div class="info-val">${t.tarif ? t.tarif + ' MAD' : 'Non précisé'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Expérience</div>
                            <div class="info-val">${t.experience_ans ? t.experience_ans + ' ans' : 'Non précisé'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Diplôme</div>
                            <div class="info-val">${t.diplome || 'Non précisé'}</div>
                        </div>
                    </div>

                    ${dispos.length > 0 ? `
                        <div class="section-title">Disponibilités</div>
                        <div class="dispo-list">
                            ${dispos.map(d => `<span class="dispo-tag">📅 ${d.trim()}</span>`).join('')}
                        </div>
                    ` : ''}

                    <div id="btn-zone">${btnHTML}</div>
                </div>
            `;

            // Vérifier statut demande si patient connecté
            if (user && user.role === 'patient') {
                verifierStatutDemande();
            }

        } catch(e) {
            document.getElementById('container').innerHTML =
                '<p style="text-align:center;color:red;padding:40px">Erreur de chargement</p>';
        }
    }

    async function verifierStatutDemande() {
        try {
            const res = await fetch('/api/demande-statut/' + user.id + '/' + therapeuteId);
            const data = await res.json();
            mettreAJourBouton(data.statut);
        } catch(e) {}
    }

    function mettreAJourBouton(statut) {
        const zone = document.getElementById('btn-zone');
        if (!zone) return;

        if (statut === 'en_attente') {
            zone.innerHTML = `
                <div class="alert alert-warning">⏳ Demande envoyée — en attente de réponse du thérapeute</div>
                <button class="btn-choisir btn-orange" disabled>⏳ En attente...</button>
            `;
        } else if (statut === 'acceptee') {
            zone.innerHTML = `
                <div class="alert alert-info" style="background:#d4edda;border-color:#c3e6cb;color:#155724;">
                    ✅ Votre demande a été acceptée ! Vous pouvez maintenant chatter.
                </div>
                <button class="btn-choisir btn-bleu" onclick="allerAuChat()">💬 Commencer le chat</button>
            `;
        } else if (statut === 'refusee') {
            zone.innerHTML = `
                <div class="alert alert-warning" style="background:#f8d7da;border-color:#f5c6cb;color:#721c24;">
                    ❌ Votre demande a été refusée.
                </div>
                <button class="btn-choisir btn-vert" onclick="window.location.href='/therapeutes'">
                    Choisir un autre thérapeute
                </button>
            `;
        }
    }

    async function envoyerDemande() {
        if (!user || user.role !== 'patient') {
            window.location.href = '/login';
            return;
        }

        const btn = document.getElementById('btn-choisir');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi...'; }

        try {
            const res = await fetch('/api/demande', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    patient_id: parseInt(user.id),
                    therapeute_id: parseInt(therapeuteId),
                    message: "Bonjour, je souhaite commencer une thérapie avec vous."
                })
            });
            const data = await res.json();
            mettreAJourBouton(data.statut);
        } catch(e) {
            if (btn) { btn.disabled = false; btn.textContent = '📩 Envoyer une demande'; }
            alert('Erreur : ' + e.message);
        }
    }

    async function allerAuChat() {
        try {
            const res = await fetch('/api/therapeute/' + therapeuteId);
            const t = await res.json();
            localStorage.setItem('matching', JSON.stringify({
                therapeute_id: parseInt(therapeuteId),
                therapeute_nom: t.nom,
                therapeute_prenom: t.prenom,
                room_id: 'patient' + user.id + '_therapeute' + therapeuteId
            }));
            window.location.href = '/chat';
        } catch(e) {
            window.location.href = '/chat';
        }
    }

    chargerProfil();
</script>
</body>
</html>
