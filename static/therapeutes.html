<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Thérapeutes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .navbar { background: #2D6A4F; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 28px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; margin-left: 20px; cursor: pointer; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #1B4332; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 28px 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.07); transition: all 0.2s; border: 2px solid transparent; cursor: pointer; }
        .card:hover { border-color: #52B788; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .avatar { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: bold; margin: 0 auto 14px; }
        .card h3 { color: #333; font-size: 16px; margin-bottom: 4px; }
        .card .specialite { color: #888; font-size: 13px; margin-bottom: 6px; }
        .card .tarif { color: #2D6A4F; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .card .note { color: #f4a261; font-size: 13px; margin-bottom: 16px; }
        .badge-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 14px; }
        .badge { background: #f0faf5; border: 1px solid #52B788; border-radius: 20px; padding: 3px 10px; font-size: 11px; color: #2D6A4F; }
        .btn-profil { background: #2D6A4F; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-profil:hover { background: #1B4332; }
        .empty { text-align: center; padding: 60px 20px; color: #888; grid-column: 1/-1; }
        .empty p { font-size: 15px; margin-top: 12px; }
        .loading { text-align: center; padding: 60px; color: #888; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">نفس</div>
    <div>
        <a onclick="retourDashboard()">← Dashboard</a>
        <a href="/">Accueil</a>
    </div>
</nav>

<div class="container">
    <h2>Nos thérapeutes</h2>
    <p class="subtitle">Cliquez sur un thérapeute pour voir son profil et le choisir</p>
    <div class="grid" id="grid">
        <div class="loading">Chargement...</div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) window.location.href = '/login';

    function retourDashboard() {
        if (user.role === 'therapeute') window.location.href = '/dashboard-therapeute';
        else window.location.href = '/dashboard-patient';
    }

    const couleurs = ['#52B788', '#4A90D9', '#E76F51', '#9B5DE5', '#F15BB5', '#00BBF9'];

    function etoiles(note) {
        if (!note) return '☆☆☆☆☆';
        return '★'.repeat(note) + '☆'.repeat(5 - note);
    }

    async function chargerTherapeutesList() {
        try {
            const res = await fetch('/api/therapeutes');
            const therapeutes = await res.json();
            const grid = document.getElementById('grid');

            if (therapeutes.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div style="font-size:50px">👨‍⚕️</div>
                        <p>Aucun thérapeute disponible pour le moment.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = therapeutes.map((t, i) => {
                const couleur = couleurs[i % couleurs.length];
                const initiale = (t.prenom || t.nom || 'T')[0].toUpperCase();
                const specialites = t.specialites
                    ? t.specialites.split(',').slice(0, 2)
                    : [];
                const langues = t.langues
                    ? t.langues.split(',').slice(0, 2)
                    : [];

                return `
                    <div class="card" onclick="voirProfil(${t.id})">
                        <div class="avatar" style="background:${couleur}">${initiale}</div>
                        <h3>Dr. ${t.prenom} ${t.nom}</h3>
                        <div class="specialite">${specialites.length > 0 ? specialites.join(' · ') : 'Thérapeute certifié'}</div>
                        ${t.tarif ? `<div class="tarif">💰 ${t.tarif} MAD / séance</div>` : ''}
                        <div class="note">${etoiles(t.note_moyenne)} ${t.nombre_avis > 0 ? '(' + t.nombre_avis + ' avis)' : ''}</div>
                        <div class="badge-list">
                            ${langues.map(l => `<span class="badge">🌍 ${l.trim()}</span>`).join('')}
                            ${t.experience_ans ? `<span class="badge">⭐ ${t.experience_ans} ans</span>` : ''}
                        </div>
                        <button class="btn-profil" onclick="event.stopPropagation();voirProfil(${t.id})">
                            👁️ Voir le profil
                        </button>
                    </div>
                `;
            }).join('');

        } catch(e) {
            document.getElementById('grid').innerHTML =
                '<p style="color:red;text-align:center">Erreur de chargement</p>';
        }
    }

    function voirProfil(therapeuteId) {
        window.location.href = '/therapeute?id=' + therapeuteId;
    }

    chargerTherapeutesList();
</script>
</body>
</html>
