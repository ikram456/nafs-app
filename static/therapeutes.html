<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Thérapeutes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .navbar { background: #2D6A4F; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 28px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; margin-left: 20px; cursor: pointer; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #1B4332; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 28px 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.07); transition: all 0.2s; border: 2px solid transparent; }
        .card:hover { border-color: #52B788; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .avatar { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: bold; margin: 0 auto 14px; }
        .card h3 { color: #333; font-size: 16px; margin-bottom: 4px; }
        .card p { color: #888; font-size: 13px; margin-bottom: 16px; }
        .btn-chat { background: #2D6A4F; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-chat:hover { background: #1B4332; }
        .btn-chat:disabled { background: #aaa; cursor: not-allowed; }
        .empty { text-align: center; padding: 60px 20px; color: #888; grid-column: 1/-1; }
        .empty p { font-size: 15px; margin-top: 12px; }
        .loading { text-align: center; padding: 60px; color: #888; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">نفس</div>
    <div>
        <a onclick="retourDashboard()">← Dashboard</a>
        <a href="/">Accueil</a>
    </div>
</nav>

<div class="container">
    <h2>Nos thérapeutes</h2>
    <p class="subtitle">Choisissez le thérapeute avec qui vous souhaitez chatter</p>
    <div class="grid" id="grid">
        <div class="loading">Chargement...</div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) window.location.href = '/login';

    function retourDashboard() {
        if (user.role === 'therapeute') window.location.href = '/dashboard-therapeute';
        else window.location.href = '/dashboard-patient';
    }

    const couleurs = ['#52B788', '#4A90D9', '#E76F51', '#9B5DE5', '#F15BB5', '#00BBF9'];

    async function chargerTherapeutesList() {
        try {
            const res = await fetch('/api/therapeutes');
            const therapeutes = await res.json();
            const grid = document.getElementById('grid');

            if (therapeutes.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div style="font-size:50px">👨‍⚕️</div>
                        <p>Aucun thérapeute disponible pour le moment.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = therapeutes.map((t, i) => {
                const couleur = couleurs[i % couleurs.length];
                const initiale = (t.prenom || t.nom || 'T')[0].toUpperCase();
                return `
                    <div class="card">
                        <div class="avatar" style="background:${couleur}">${initiale}</div>
                        <h3>Dr. ${t.prenom} ${t.nom}</h3>
                        <p>Thérapeute certifié</p>
                        <button class="btn-chat" id="btn-${t.id}" onclick="allerAuChat(${t.id}, '${t.nom}', '${t.prenom}', this)">
                            💬 Chatter
                        </button>
                    </div>
                `;
            }).join('');

        } catch(e) {
            document.getElementById('grid').innerHTML = '<p style="color:red;text-align:center">Erreur de chargement</p>';
        }
    }

    async function allerAuChat(therapeuteId, nom, prenom, btn) {
        // Désactiver le bouton pendant le chargement
        btn.disabled = true;
        btn.textContent = '⏳ Chargement...';

        try {
            // ✅ Sauvegarder le matching en DB
            await fetch('/api/choisir-therapeute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    patient_id: user.id,
                    therapeute_id: therapeuteId
                })
            });

            // ✅ Sauvegarder dans localStorage
            localStorage.setItem('matching', JSON.stringify({
                therapeute_id: therapeuteId,
                therapeute_nom: nom,
                therapeute_prenom: prenom,
                room_id: `patient${user.id}_therapeute${therapeuteId}`
            }));

            // ✅ Aller au chat
            window.location.href = '/chat';

        } catch(e) {
            btn.disabled = false;
            btn.textContent = '💬 Chatter';
            alert('Erreur de connexion. Réessayez.');
        }
    }

    chargerTherapeutesList();
</script>
</body>
</html>
