<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafs App - Séance Vidéo</title>
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #2D6A4F; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .navbar .logo { color: white; font-size: 24px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; margin-left: 20px; }
        .video-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #call-frame { width: 100%; max-width: 900px; height: 500px; border-radius: 15px; overflow: hidden; background: #000; }
        .controls { display: flex; gap: 15px; margin-top: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-start { background: #2D6A4F; color: white; }
        .btn-end { background: #E63946; color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.05); }
        .info-card { background: white; border-radius: 15px; padding: 25px; max-width: 500px; text-align: center; margin-bottom: 20px; }
        .info-card h2 { color: #2D6A4F; margin-bottom: 10px; }
        .info-card p { color: #666; font-size: 14px; margin-bottom: 15px; }
        .therapist-avatar { width: 80px; height: 80px; border-radius: 50%; background: #52B788; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; font-weight: bold; margin: 0 auto 15px; }
        .status { padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .status.waiting { background: #fff3e0; color: #e65100; }
        .status.connected { background: #e8f5e9; color: #2D6A4F; }
        #waiting-screen { display: flex; flex-direction: column; align-items: center; }
        #video-screen { display: none; width: 100%; max-width: 900px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">نفس 🎥</div>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/">Accueil</a>
    </div>
</nav>

<div class="video-container">
    <div id="waiting-screen">
        <div class="info-card">
            <div class="therapist-avatar">ف</div>
            <h2>Séance avec Dr. Fatima Zahra</h2>
            <p>Votre séance vidéo va commencer. Assurez-vous que votre caméra et microphone sont activés.</p>
            <div class="status waiting" id="status">⏳ En attente...</div>
        </div>
        <div class="controls">
            <button class="btn btn-start" onclick="demarrerSeance()">
                📹 Démarrer la séance
            </button>
        </div>
    </div>

    <div id="video-screen">
        <div id="call-frame"></div>
        <div class="controls">
            <button class="btn btn-end" onclick="terminerSeance()">
                📵 Terminer la séance
            </button>
        </div>
    </div>
</div>

<script>
    const DAILY_API_KEY = '282286f7928b1501d7d6bf2a71ea38400a9e20b5671ac3938761de4a1fd38953';
    let callFrame = null;

    async function demarrerSeance() {
        document.getElementById('status').textContent = '🔄 Connexion en cours...';
        document.getElementById('status').className = 'status waiting';

        try {
            const response = await fetch('/api/video/creer-salle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await response.json();

            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('video-screen').style.display = 'block';

            callFrame = window.DailyIframe.createFrame(
                document.getElementById('call-frame'),
                {
                    showLeaveButton: true,
                    showFullscreenButton: true,
                    iframeStyle: {
                        width: '100%',
                        height: '500px',
                        border: 'none',
                        borderRadius: '15px'
                    }
                }
            );

            await callFrame.join({ url: data.url });

        } catch(e) {
            document.getElementById('status').textContent = '❌ Erreur de connexion';
            console.error(e);
        }
    }

    function terminerSeance() {
        if (callFrame) {
            callFrame.destroy();
        }
        document.getElementById('video-screen').style.display = 'none';
        document.getElementById('waiting-screen').style.display = 'flex';
        document.getElementById('status').textContent = '✅ Séance terminée';
        document.getElementById('status').className = 'status connected';
    }
</script>

</body>
</html>
